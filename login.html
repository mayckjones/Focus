<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="same-origin">
    <title>Entrar — Foque em Checks</title>
    <link rel="icon" type="image/png" href="assets/img/Documento2.png">
    <link rel="stylesheet" href="assets/css/cloud.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
    <main class="card">
        <div class="brand">
            <img src="assets/img/logo-focus-claro.png" alt="Foque em Checks" class="focus-theme-logo focus-logo-light">
            <img src="assets/img/logo-focus-escuro.png" alt="" aria-hidden="true" class="focus-theme-logo focus-logo-dark">
        </div>
        <h1 id="title">Acesse sua conta</h1>
        <p id="subtitle" class="subtitle">Suas tarefas ficam salvas e protegidas na nuvem.</p>

        <div class="tabs" role="tablist" aria-label="Acessar conta">
            <button id="login-tab" class="tab active" type="button">Entrar</button>
            <button id="signup-tab" class="tab" type="button">Criar conta</button>
        </div>

        <form id="auth-form">
            <div class="field">
                <label for="email">E-mail</label>
                <input id="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required>
            </div>
            <div class="field">
                <label for="password">Senha</label>
                <input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="Mínimo de 6 caracteres" required>
            </div>
            <div id="confirmation-field" class="field hidden">
                <label for="password-confirmation">Confirmar senha</label>
                <input id="password-confirmation" type="password" autocomplete="new-password" minlength="8" placeholder="Digite novamente">
            </div>
            <button id="submit-button" class="submit" type="submit">Entrar</button>
        </form>
        <div id="message" class="message hidden" role="status" aria-live="polite"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
